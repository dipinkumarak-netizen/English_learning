services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nilaspeak}
      POSTGRES_USER: ${POSTGRES_USER:-nilaspeak}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
  backend:
    build:
      context: ./backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_VERSION: ${APP_VERSION:-0.1.0}
      DATABASE_URL: ${DATABASE_URL:-}
      DATABASE_EXPECTED_HOST: ${DATABASE_EXPECTED_HOST:-db}
      POSTGRES_DB: ${POSTGRES_DB:-nilaspeak}
      POSTGRES_USER: ${POSTGRES_USER:-nilaspeak}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS:-http://localhost:3000,http://localhost:8080}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-}
      JWT_SECRET: ${JWT_SECRET:-}
      ACCESS_TOKEN_MINUTES: ${ACCESS_TOKEN_MINUTES:-15}
      REFRESH_TOKEN_DAYS: ${REFRESH_TOKEN_DAYS:-30}
      CREDENTIAL_ENCRYPTION_KEY: ${CREDENTIAL_ENCRYPTION_KEY:-}
      CREDENTIAL_ENCRYPTION_PREVIOUS_KEY: ${CREDENTIAL_ENCRYPTION_PREVIOUS_KEY:-}
      PROVIDER_ALLOWED_BASE_URLS: ${PROVIDER_ALLOWED_BASE_URLS:-https://api.openai.com/v1}
      PROVIDER_ALLOW_LOCAL_URLS: ${PROVIDER_ALLOW_LOCAL_URLS:-false}
      PROVIDER_SETTINGS_RATE_LIMIT_PER_HOUR: ${PROVIDER_SETTINGS_RATE_LIMIT_PER_HOUR:-10}
      TRUST_PROXY_HEADERS: ${TRUST_PROXY_HEADERS:-false}
      TRUSTED_PROXY_NETWORKS: ${TRUSTED_PROXY_NETWORKS:-}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      AI_PROVIDER: ${AI_PROVIDER:-none}
      AI_MODEL: ${AI_MODEL:-mock-tutor-v1}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_REQUEST_TIMEOUT_SECONDS: ${AI_REQUEST_TIMEOUT_SECONDS:-20}
      AI_MAX_OUTPUT_TOKENS: ${AI_MAX_OUTPUT_TOKENS:-400}
      AI_DAILY_REQUEST_LIMIT: ${AI_DAILY_REQUEST_LIMIT:-50}
      AI_DAILY_TOKEN_LIMIT: ${AI_DAILY_TOKEN_LIMIT:-12000}
      AI_MAX_MESSAGE_CHARACTERS: ${AI_MAX_MESSAGE_CHARACTERS:-2000}
      AI_CONVERSATION_CONTEXT_LIMIT: ${AI_CONVERSATION_CONTEXT_LIMIT:-12}
      AI_PROVIDER_ENABLED: ${AI_PROVIDER_ENABLED:-false}
      STT_PROVIDER: ${STT_PROVIDER:-none}
      STT_MODEL: ${STT_MODEL:-mock-stt-v1}
      STT_API_KEY: ${STT_API_KEY:-}
      STT_BASE_URL: ${STT_BASE_URL:-}
      STT_REQUEST_TIMEOUT_SECONDS: ${STT_REQUEST_TIMEOUT_SECONDS:-20}
      STT_MAX_AUDIO_SECONDS: ${STT_MAX_AUDIO_SECONDS:-60}
      STT_MAX_UPLOAD_BYTES: ${STT_MAX_UPLOAD_BYTES:-5000000}
      STT_ENABLED: ${STT_ENABLED:-false}
      TTS_PROVIDER: ${TTS_PROVIDER:-none}
      TTS_MODEL: ${TTS_MODEL:-mock-tts-v1}
      TTS_VOICE: ${TTS_VOICE:-default}
      TTS_API_KEY: ${TTS_API_KEY:-}
      TTS_BASE_URL: ${TTS_BASE_URL:-}
      TTS_REQUEST_TIMEOUT_SECONDS: ${TTS_REQUEST_TIMEOUT_SECONDS:-20}
      TTS_MAX_TEXT_CHARACTERS: ${TTS_MAX_TEXT_CHARACTERS:-500}
      TTS_ENABLED: ${TTS_ENABLED:-false}
      VOICE_DAILY_TRANSCRIPTION_SECONDS: ${VOICE_DAILY_TRANSCRIPTION_SECONDS:-600}
      VOICE_DAILY_SYNTHESIS_CHARACTERS: ${VOICE_DAILY_SYNTHESIS_CHARACTERS:-10000}
      VOICE_MAX_TURNS_PER_SESSION: ${VOICE_MAX_TURNS_PER_SESSION:-20}
      VOICE_TEMP_AUDIO_RETENTION_MINUTES: ${VOICE_TEMP_AUDIO_RETENTION_MINUTES:-30}
      VOICE_AUDIO_STORAGE_PATH: ${VOICE_AUDIO_STORAGE_PATH:-/var/lib/nilaspeak/audio}
    volumes:
      - voice_audio:/var/lib/nilaspeak/audio
    depends_on:
      db:
        condition: service_healthy
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
volumes:
  postgres_data:
  voice_audio:
