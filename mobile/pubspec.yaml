name: nilaspeak_mobile
description: "NilaSpeak Malayalam-first spoken English learning foundation."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  dio: ^5.8.0+1
  drift: ^2.28.1
  flutter_riverpod: ^2.6.1
  flutter_secure_storage: ^9.2.4
  go_router: ^16.2.5
  path_provider: ^2.1.5
  sqlite3_flutter_libs: ^0.5.28
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.15
  drift_dev: ^2.28.1

flutter:
  uses-material-design: true
  generate: true
